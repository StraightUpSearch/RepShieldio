<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#f3f4f6"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#f97316"/>
  <!-- Shield icon -->
  <g transform="translate(540, 120)">
    <rect width="120" height="120" rx="16" fill="#fff7ed"/>
    <path d="M60 18 L96 32 L96 64 C96 90 80 112 60 118 C40 112 24 90 24 64 L24 32 Z"
          fill="#f97316"/>
    <path d="M60 28 L88 40 L88 64 C88 84 76 102 60 108 C44 102 32 84 32 64 L32 40 Z"
          fill="white" fill-opacity="0.3"/>
    <path d="M46 66 L55 75 L74 54"
          fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Headline -->
  <text x="600" y="310" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900"
        text-anchor="middle" fill="#111827" letter-spacing="-2">RepShield</text>
  <!-- Subline -->
  <text x="600" y="370" font-family="Arial, Helvetica, sans-serif" font-size="28"
        text-anchor="middle" fill="#6b7280">Get Reddit posts removed. Fast.</text>
  <!-- Trust stat pills -->
  <rect x="310" y="410" width="175" height="44" rx="22" fill="#fff7ed"/>
  <text x="397" y="438" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#f97316">1,650+ Cases</text>
  <rect x="510" y="410" width="175" height="44" rx="22" fill="#fff7ed"/>
  <text x="597" y="438" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#f97316">95% Success</text>
  <rect x="710" y="410" width="175" height="44" rx="22" fill="#fff7ed"/>
  <text x="797" y="438" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#f97316">Pay on Success</text>
  <!-- Domain -->
  <text x="600" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20"
